# Peasely-
アカウント不要、1日1タップで寄付ができます！
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Peacely - Tap for Peace</title>
<style>
/* =========================================================
1. 基本スタイル & CSS変数 (カラー・アニメーション)
========================================================= */
:root {
--bg-gradient: linear-gradient(135deg, #0b0d1b 0%, #1a1c38 50%, #0d1b2a 100%);
--card-bg: rgba(255, 255, 255, 0.05);
--card-border: rgba(255, 255, 255, 0.1);
--primary-neon: #00f2fe;
--secondary-neon: #4facfe;
--accent-pink: #ff007f;
--gold-counter: #ffe600;
--text-main: #ffffff;
--text-sub: #a0aec0;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: transparent;
user-select: none;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
background: var(--bg-gradient);
color: var(--text-main);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
padding: 24px 16px;
overflow-x: hidden;
position: relative;
}

/* 背景の星屑グラデーションアニメーション */
body::before {
content: '';
position: absolute;
top: -50%;
left: -50%;
width: 200%;
height: 200%;
background: radial-gradient(circle, rgba(79,172,254,0.1) 0%, rgba(0,0,0,0) 70%);
animation: pulseGlow 8s infinite alternate ease-in-out;
z-index: 0;
pointer-events: none;
}

@keyframes pulseGlow {
0% { transform: scale(0.8) rotate(0deg); opacity: 0.5; }
100% { transform: scale(1.2) rotate(10deg); opacity: 1; }
}

/* =========================================================
2. レイアウト & コンテナ
========================================================= */
.app-container {
width: 100%;
max-width: 420px;
margin: 0 auto;
display: flex;
flex-direction: column;
align-items: center;
z-index: 1;
height: 100%;
}

/* ヘッダー */
header {
text-align: center;
margin-top: 10px;
margin-bottom: 20px;
}

.logo {
font-size: 28px;
font-weight: 800;
letter-spacing: 3px;
background: linear-gradient(90deg, #00f2fe, #4facfe, #00f2fe);
background-size: 200% auto;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
animation: shineText 4s linear infinite;
}

@keyframes shineText {
to { background-position: 200% center; }
}

.subtitle {
font-size: 13px;
color: var(--text-sub);
margin-top: 6px;
letter-spacing: 0.5px;
}

/* メインカード (世界のカウンター) */
.world-card {
width: 100%;
background: var(--card-bg);
border: 1px solid var(--card-border);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border-radius: 24px;
padding: 24px 16px;
text-align: center;
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
margin-bottom: 30px;
position: relative;
}

.world-title {
font-size: 12px;
color: var(--primary-neon);
text-transform: uppercase;
letter-spacing: 2px;
font-weight: 600;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
}

.live-badge {
width: 8px;
height: 8px;
background-color: #00ff88;
border-radius: 50%;
box-shadow: 0 0 8px #00ff88;
animation: blink 1.5s infinite;
}

@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0.3; }
}

.world-count {
font-size: 42px;
font-weight: 900;
color: var(--gold-counter);
margin: 10px 0;
letter-spacing: 1px;
text-shadow: 0 0 15px rgba(255, 230, 0, 0.3);
font-variant-numeric: tabular-nums;
}

.donation-impact {
font-size: 13px;
color: var(--text-sub);
}

.donation-impact span {
color: #00ff88;
font-weight: bold;
}

/* =========================================================
3. メインボタン & インタラクション
========================================================= */
.button-zone {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
margin: 20px 0;
position: relative;
}

.tap-button {
position: relative;
width: 200px;
height: 200px;
border-radius: 50%;
border: none;
background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #6b11ff 100%);
color: white;
font-size: 20px;
font-weight: 800;
cursor: pointer;
box-shadow: 0 0 40px rgba(0, 242, 254, 0.4),
inset 0 0 15px rgba(255, 255, 255, 0.4);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 8px;
transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
outline: none;
}

.tap-button:active:not(:disabled) {
transform: scale(0.92);
box-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
}

.tap-button .icon {
font-size: 48px;
filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
transition: transform 0.3s ease;
}

.tap-button:hover .icon {
transform: scale(1.1) rotate(-5deg);
}

/* 完了状態（タップ済み）のボタン */
.tap-button.completed {
background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
border: 2px solid rgba(255, 255, 255, 0.1);
box-shadow: none;
cursor: default;
}

.tap-button.completed .icon {
filter: grayscale(1);
opacity: 0.5;
}

/* リングウェーブ波紋アニメーション */
.pulse-ring {
position: absolute;
width: 200px;
height: 200px;
border-radius: 50%;
border: 2px solid var(--primary-neon);
animation: ringExpand 2.5s infinite ease-out;
pointer-events: none;
}

@keyframes ringExpand {
0% { transform: scale(1); opacity: 0.8; }
100% { transform: scale(1.6); opacity: 0; }
}

/* メッセージ・ステータス表示 */
.status-message {
margin-top: 24px;
font-size: 15px;
font-weight: 600;
min-height: 48px;
text-align: center;
padding: 10px 20px;
border-radius: 20px;
transition: all 0.3s ease;
}

.status-message.success {
background: rgba(0, 255, 136, 0.15);
color: #00ff88;
border: 1px solid rgba(0, 255, 136, 0.3);
}

/* =========================================================
4. フッター (個人ログ・情報)
========================================================= */
footer {
width: 100%;
text-align: center;
font-size: 12px;
color: var(--text-sub);
margin-bottom: 10px;
display: flex;
flex-direction: column;
gap: 8px;
}

.personal-stats {
background: var(--card-bg);
border: 1px solid var(--card-border);
padding: 12px;
border-radius: 16px;
display: flex;
justify-content: space-around;
}

.stat-item {
display: flex;
flex-direction: column;
}

.stat-value {
font-size: 16px;
font-weight: bold;
color: var(--text-main);
}

/* エフェクト用のキャンバス */
#particleCanvas {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
z-index: 10;
}
</style>
</head>
<body>

<!-- パーティクル（光の粒）用キャンバス -->
<canvas id="particleCanvas"></canvas>

<div class="app-container">

<!-- 1. ヘッダー -->
<header>
<div class="logo">PEACELY</div>
<div class="subtitle">タップで広がる、世界平和への1歩</div>
</header>

<!-- 2. 世界のタップ数カード -->
<div class="world-card">
<div class="world-title">
<div class="live-badge"></div>
Today's Global Taps
</div>
<div class="world-count" id="globalCount">1,248,930</div>
<div class="donation-impact">
今日の推定支援額: <span id="donationAmount">$12,489.30</span>
</div>
</div>

<!-- 3. タップボタンエリア -->
<div class="button-zone">
<div class="pulse-ring" id="pulseRing"></div>
<button class="tap-button" id="tapBtn" onclick="handleTap(event)">
<span class="icon" id="btnIcon">🕊️</span>
<span id="btnText">Tap for Peace</span>
</button>
</div>

<!-- メッセージ表示エリア -->
<div class="status-message" id="statusMessage">
1日1回タップして平和に貢献しよう
</div>

<!-- 4. フッター・個人の貢献記録 -->
<footer>
<div class="personal-stats">
<div class="stat-item">
<span style="color: var(--text-sub);">あなたの通算タップ</span>
<span class="stat-value" id="userTotalTaps">0 日</span>
</div>
<div class="stat-item">
<span style="color: var(--text-sub);">ステータス</span>
<span class="stat-value" id="userStatus" style="color: #00f2fe;">未達成</span>
</div>
</div>
<p style="margin-top: 8px; opacity: 0.6;">登録不要・広告収益等は国際支援団体へ還元されます</p>
</footer>

</div>

<!-- =========================================================
5. JavaScript (ロジック・保存機能・アニメーション)
========================================================= -->
<script>
// --- 初期データ & 変数設定 ---
const BASE_GLOBAL_COUNT = 1248930; // ベースとなる世界のタップ数
const PER_TAP_DONATION = 0.01; // 1タップあたりの寄付額換算 (ドル)

// DOM要素
const globalCountEl = document.getElementById('globalCount');
const donationAmountEl = document.getElementById('donationAmount');
const tapBtn = document.getElementById('tapBtn');
const btnIcon = document.getElementById('btnIcon');
const btnText = document.getElementById('btnText');
const pulseRing = document.getElementById('pulseRing');
const statusMessage = document.getElementById('statusMessage');
const userTotalTapsEl = document.getElementById('userTotalTaps');
const userStatusEl = document.getElementById('userStatus');

// ローカルストレージキー
const STORAGE_KEY_DATE = 'peacely_last_tap_date';
const STORAGE_KEY_TOTAL = 'peacely_total_taps';

// 今日の日付を取得 (YYYY-MM-DD 形式)
function getTodayString() {
const today = new Date();
return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
}

// アプリ起動時の初期化処理
function initApp() {
const lastTapDate = localStorage.getItem(STORAGE_KEY_DATE);
const totalTaps = parseInt(localStorage.getItem(STORAGE_KEY_TOTAL) || '0', 10);
const todayStr = getTodayString();

userTotalTapsEl.innerText = `${totalTaps} 日`;

// 本日すでにタップ済みか判定
if (lastTapDate === todayStr) {
setCompletedState();
}

// 世界のカウンターにランダム感（ライブ感）を持たせる
updateGlobalCounter(BASE_GLOBAL_COUNT + (lastTapDate === todayStr ? 1 : 0));
startLiveSimulation();
}

// 画面のカウント＆寄付金額更新
function updateGlobalCounter(count) {
globalCountEl.innerText = count.toLocaleString();
const donation = (count * PER_TAP_DONATION).toLocaleString('en-US', {
style: 'currency',
currency: 'USD'
});
donationAmountEl.innerText = donation;
}

// リアルタイムで世界の誰かが押しているようなカウント増加シミュレーション
function startLiveSimulation() {
setInterval(() => {
let currentCount = parseInt(globalCountEl.innerText.replace(/,/g, ''), 10);
// 1〜3秒に1回、1〜3カウント増加
if (Math.random() > 0.4) {
currentCount += Math.floor(Math.random() * 3) + 1;
updateGlobalCounter(currentCount);
}
}, 2000);
}

// タップボタンが押された時の処理
function handleTap(event) {
const todayStr = getTodayString();
const lastTapDate = localStorage.getItem(STORAGE_KEY_DATE);

// 連投防止チェック
if (lastTapDate === todayStr) return;

// 1. ローカルストレージに今日の日付と実績を保存
localStorage.setItem(STORAGE_KEY_DATE, todayStr);
let totalTaps = parseInt(localStorage.getItem(STORAGE_KEY_TOTAL) || '0', 10) + 1;
localStorage.setItem(STORAGE_KEY_TOTAL, totalTaps);

// 2. カウントの即時増加
let currentCount = parseInt(globalCountEl.innerText.replace(/,/g, ''), 10) + 1;
updateGlobalCounter(currentCount);

// 3. 画面表示の更新
userTotalTapsEl.innerText = `${totalTaps} 日`;
setCompletedState();

// 4. パーティクルエフェクト発動
createParticles(event.clientX || window.innerWidth / 2, event.clientY || window.innerHeight / 2);
}

// 完了状態（本日タップ済み）のUIへ切り替え
function setCompletedState() {
tapBtn.classList.add('completed');
tapBtn.disabled = true;
btnIcon.innerText = '✨';
btnText.innerText = 'また明日！';
pulseRing.style.display = 'none';

statusMessage.classList.add('success');
statusMessage.innerText = '🕊️ 今日のタップが完了しました！世界へ想いが届けられました。';

userStatusEl.innerText = '完了';
userStatusEl.style.color = '#00ff88';
}

// =========================================================
// 6. 演出用パーティクル (光の粒散布) JS
// =========================================================
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function createParticles(x, y) {
for (let i = 0; i < 40; i++) {
particles.push({
x: x,
y: y,
radius: Math.random() * 4 + 2,
color: `hsl(${Math.random() * 60 + 170}, 100%, 70%)`, // 鮮やかな青〜緑系
vx: (Math.random() - 0.5) * 12,
vy: (Math.random() - 0.5) * 12,
alpha: 1,
decay: Math.random() * 0.02 + 0.015
});
}
animateParticles();
}

function animateParticles() {
ctx.clearRect(0, 0, canvas.width, canvas.height);

particles.forEach((p, index) => {
p.x += p.vx;
p.y += p.vy;
p.alpha -= p.decay;

ctx.save();
ctx.globalAlpha = Math.max(p.alpha, 0);
ctx.beginPath();
ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
ctx.fillStyle = p.color;
ctx.shadowBlur = 10;
ctx.shadowColor = p.color;
ctx.fill();
ctx.restore();

if (p.alpha <= 0) {
particles.splice(index, 1);
}
});

if (particles.length > 0) {
requestAnimationFrame(animateParticles);
}
}

// アプリ初期化実行
window.onload = initApp;
</script>
</body>
</html>
